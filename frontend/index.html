<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6fb" />
    <title>CISGuard — Security Workspace</title>
    <script>
      try {
        const savedPreference = localStorage.getItem("cisguard-theme");
        const preference = ["light", "dark", "system"].includes(savedPreference)
          ? savedPreference
          : "system";
        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const resolvedTheme =
          preference === "system"
            ? systemPrefersDark
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.style.colorScheme = resolvedTheme;
      } catch (error) {
        console.warn("Unable to initialize the saved theme preference.", error);
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
